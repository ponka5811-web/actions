name: Hello World
on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
    startup:
        name: startup script
        runs-on: ubuntu-latest
        steps:
          - run: echo "Hello World"
    build:
        name: my build task
        runs-on: ubuntu-latest
        needs: startup
        steps:
          - name: Comment on PR
            run: gh pr comment $PR_URL --body "Thanks for the PR, we will review it soon!"
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              PR_URL: ${{ github.event.pull_request.html_url }}
          - name: Checking for file
            run: ./.github/scripts/checkers.sh
            env:
              FILE: ./src/components/buttons.js
    